spring:
  datasource:
    url: jdbc:h2:mem:chatbot_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

whatsapp:
  enabled: false
  api-url: "https://graph.example.test"
  api-version: "v21.0"
  access-token: ""
  phone-number-id: ""
  contact-phone: ""
  webhook-verify-token: "token-de-teste"
  app-secret: ""

ai:
  enabled: false
  api-url: ""
  api-key: ""
  model: ""
  timeout-seconds: 1
  max-output-tokens: 100
  history-messages: 10
  max-input-chars: 1000
  min-confidence: 0.6
  knowledge-base: "classpath:assistant/knowledge-base.md"

conversation:
  lifecycle:
    enabled: false
    inactivity-hours: 24
    check-interval-ms: 300000
  handoff:
    max-unresolved-attempts: 3

logging:
  level:
    root: WARN
    com.chatbot.whatsapp: INFO
