spring:
  application:
    name: whatsapp-chatbot-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chatbot_db}
    username: ${DATABASE_USERNAME:chatbot}
    password: ${DATABASE_PASSWORD:chatbot}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # O schema e controlado pelo Flyway. O Hibernate apenas valida
      # se as entidades batem com o schema real do banco.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Integracao com a WhatsApp Business Platform (Meta Cloud API).
# Com enabled=false (padrao) o sistema roda inteiro sem credenciais: as respostas
# sao apenas logadas pelo MockWhatsAppSender e o simulador em /simulator continua
# funcionando. Ver README (secao "Integracao real com WhatsApp") para o passo a passo.
whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}
  api-url: ${WHATSAPP_API_URL:https://graph.facebook.com}
  api-version: ${WHATSAPP_API_VERSION:v21.0}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}

# Geracao opcional de respostas com uma API compativel com OpenAI Responses.
# Desabilitada por padrao; as respostas locais continuam sendo o fallback.
ai:
  enabled: ${AI_ENABLED:false}
  api-url: ${AI_API_URL:https://api.openai.com/v1/responses}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:10}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:300}

# Conversas ainda operadas pelo bot sao encerradas depois do periodo de
# inatividade. Atendimentos WAITING_HUMAN e HUMAN_ACTIVE nunca entram nessa rotina.
conversation:
  lifecycle:
    enabled: ${CONVERSATION_AUTO_CLOSE_ENABLED:true}
    inactivity-hours: ${CONVERSATION_INACTIVITY_HOURS:24}
    check-interval-ms: ${CONVERSATION_CHECK_INTERVAL_MS:300000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.chatbot.whatsapp: ${APP_LOG_LEVEL:INFO}
